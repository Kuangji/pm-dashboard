name: Validate dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pm-dashboard
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx tsx --test app/components/*.test.ts app/components/*.test.tsx app/lib/*.test.ts scripts/*.test.ts

      # Vercel's Git integration deploys this same committed publication.
      - name: Build committed content
        run: npm run build
